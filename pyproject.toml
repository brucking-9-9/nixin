[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nixin"
version = "0.1.0"
description = "Package and option installer for NixOS + Home Manager flake configs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["requests", "textual"]

[project.scripts]
nixin = "nixin.cli:main"
nixin-tui = "nixin.tui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nixin.truth" = ["*.nix"]
"nixin.tui" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
